<!DOCTYPE html>
<html lang="fr" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Jéhoiakim Kingné</title>
<meta name="description" content="Contacter Jéhoiakim Kingné.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,560;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="wordmark">Jéhoiakim Kingné</a>
    <nav class="site-nav">
      <a href="index.html">Accueil</a>
      <a href="about.html">À propos</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="../contact.html" class="lang-switch" hreflang="en">EN</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-blob" aria-hidden="true"></div>
    <div class="wrap">
      <p class="kicker">Contact</p>
      <h1>Me contacter</h1>
      <p class="lede">Que ce soit pour un projet de conseil, à propos du blog, ou pour toute autre raison — n'hésitez pas à me contacter.</p>
    </div>
  </section>

  <section style="border-top: none; padding-top: 0;">
    <div class="wrap contact-block reveal">

      <ul class="contact-list">
        <li><span class="label">Email</span> <a href="mailto:hello@jehoiakimkingne.com">hello@jehoiakimkingne.com</a></li>
        <li><span class="label">GitHub</span> <a href="https://github.com/jehoiakimkingne" target="_blank" rel="noopener">github.com/jehoiakimkingne</a></li>
      </ul>

      <form class="contact-form" action="" method="POST">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Envoyer</button>
      </form>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>&copy; 2026 Jéhoiakim Kingné.</p>
  </div>
</footer>

<script src="../js/main.js"></script>
</body>
</html>
